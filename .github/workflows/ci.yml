name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  build:
    name: Lint, unit tests, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          sm="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sm" --licenses > /dev/null || true
          "$sm" "platforms;android-37.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the project signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          # Same key as the local builds (see scripts/set-signing-secret.sh); without the secret (forks) Android's own debug key is used.
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
            echo "Signing with the project key"
          else
            echo "No SIGNING_KEYSTORE_B64 secret: signing with a throw-away debug key"
          fi

      - name: Lint, test, assemble
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --console=plain

      - name: Show the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "SHA-256"

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Keep the APKs
        uses: actions/upload-artifact@v4
        with:
          name: party-queue-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14
