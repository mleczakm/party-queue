<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#7c3aed">
<title>Party Queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2e93'/%3E%3Cstop offset='.55' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%2322b8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='30' width='8' height='20' rx='4' fill='%23fff'/%3E%3Crect x='28' y='16' width='8' height='34' rx='4' fill='%23fff'/%3E%3Crect x='42' y='24' width='8' height='26' rx='4' fill='%23fff'/%3E%3Ccircle cx='51' cy='13' r='4' fill='%23b8f34a'/%3E%3C/svg%3E">
<style>
  :root {
    --pink:#ff2e93; --violet:#7c3aed; --blue:#22b8ff; --orange:#ff9f1c; --lime:#b8f34a;
    --grad: linear-gradient(120deg, var(--pink), var(--violet) 55%, var(--blue));
    --bg:#130a26; --bg2:#1b1033; --card:#241741; --card2:#2b1b4b; --line:#3a2a62; --text:#f3ecff; --muted:#bcaedb;
    --accent:#c4a3ff; --accent-ink:#1b0b3a; --danger:#ff8a9b; --ok:#7ee0a3; --shadow:0 8px 28px #0006; --glass:#130a26cc;
  }
  :root[data-theme=light] {
    --bg:#fff7fc; --bg2:#fbf2ff; --card:#ffffff; --card2:#f6ebff; --line:#e4d5f5; --text:#241437; --muted:#6a5784;
    --accent:#6d28d9; --accent-ink:#fff; --danger:#c0213d; --ok:#17884f; --shadow:0 8px 24px #7c3aed26; --glass:#fff7fccc;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  /* The page must not jump sideways when a tab is short and the scrollbar goes away. */
  html { color-scheme: dark; overflow-y: scroll; scrollbar-gutter: stable; }
  :root[data-theme=light] { color-scheme: light; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(60vmax 40vmax at 0% 0%, #ff2e9333, transparent 60%), radial-gradient(60vmax 40vmax at 100% 10%, #22b8ff2e, transparent 60%), radial-gradient(50vmax 40vmax at 50% 100%, #7c3aed33, transparent 60%); }
  svg.i { width:1.25em; height:1.25em; fill:currentColor; flex:none; vertical-align:middle; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- header */
  header { position:sticky; top:0; z-index:20; background:var(--grad); color:#fff; padding:max(env(safe-area-inset-top),0px) 0 0; box-shadow:0 2px 18px #7c3aed55; }
  .bar { display:flex; align-items:center; gap:12px; max-width:1280px; margin:0 auto; padding:9px 16px; }
  .logo { width:34px; height:34px; border-radius:10px; background:#ffffff26; display:grid; place-items:center; flex:none; }
  .brand { font-weight:800; font-size:19px; letter-spacing:-.3px; white-space:nowrap; }
  .tag { font-size:11px; opacity:.85; margin-top:-2px; white-space:nowrap; }
  @media (max-width:560px) { .tag, .pill .nm { display:none; } .bar { gap:8px; padding:8px 12px; } }
  @media (max-width:600px) { .ib.mv { display:none; } .item img { width:64px; } }
  .sp { flex:1; }
  .pill { font-size:12px; padding:3px 10px; border-radius:99px; background:#ffffff2e; font-weight:700; white-space:nowrap; }
  .pill.host { background:var(--lime); color:#1b3a00; }
  .iconbtn { width:38px; height:38px; border-radius:50%; border:0; background:#ffffff24; color:#fff; display:inline-grid; place-items:center; transition:background .15s, transform .15s; }
  .iconbtn:hover { background:#ffffff40; } .iconbtn:active { transform:scale(.92); }

  /* ---------- layout */
  main { max-width:1280px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom)); display:grid; gap:16px; grid-template-columns:minmax(0,1fr); align-items:start; }
  @media (min-width:900px) { main { grid-template-columns:minmax(340px,420px) minmax(0,1fr); gap:24px; padding-top:22px; } .side { position:sticky; top:84px; } }
  @media (min-width:1500px) { main, .bar { max-width:1480px; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px; box-shadow:var(--shadow); }

  /* ---------- now playing */
  .np { position:relative; overflow:hidden; border:0; color:#fff; background:var(--grad); background-size:200% 200%; animation:flow 16s ease-in-out infinite alternate; padding:16px; }
  @keyframes flow { from { background-position:0% 40%; } to { background-position:100% 60%; } }
  .np-top { display:flex; gap:14px; align-items:center; }
  .np-art { width:96px; aspect-ratio:16/9; border-radius:14px; background:#ffffff26 center/cover; flex:none; position:relative; box-shadow:0 6px 18px #0004; }
  @media (min-width:900px) { .np-top { flex-direction:column; align-items:stretch; } .np-art { width:100%; border-radius:16px; } .np-text { text-align:left; } }
  .np-title { font-weight:800; font-size:17px; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .np-sub { opacity:.85; font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .eq { display:inline-flex; gap:2px; align-items:flex-end; height:14px; margin-right:6px; vertical-align:-1px; }
  .eq i { width:3px; background:#fff; border-radius:2px; height:30%; }
  .playing .eq i { animation:eq 0.9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay:-.3s; } .eq i:nth-child(3) { animation-delay:-.6s; }
  @keyframes eq { from { height:20%; } to { height:100%; } }
  .prog { margin-top:12px; display:flex; align-items:center; gap:8px; font-size:12px; font-variant-numeric:tabular-nums; }
  .track { flex:1; height:6px; border-radius:99px; background:#ffffff40; overflow:hidden; position:relative; }
  .track.seek { cursor:pointer; height:8px; } .track.seek:hover { height:10px; }
  .track > div { height:100%; width:0; background:linear-gradient(90deg,#fff,var(--lime)); border-radius:inherit; transition:width .9s linear; }
  .ctl { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px; }
  .ctl .iconbtn { width:44px; height:44px; font-size:18px; }
  .ctl .big { width:58px; height:58px; font-size:24px; background:#fff; color:var(--violet); box-shadow:0 6px 18px #0004; }
  .ctl .big:hover { background:#fff; transform:scale(1.06); }
  .ctl .on { background:#fff; color:var(--violet); }
  .vol { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; font-variant-numeric:tabular-nums; }
  .vol .iconbtn { width:34px; height:34px; font-size:16px; }
  .vol input[type=range] { flex:1; min-width:0; accent-color:#fff; height:6px; cursor:pointer; }
  .vol output { width:34px; text-align:right; }
  .hint { opacity:.8; font-size:11.5px; text-align:center; margin-top:8px; }
  #notice { margin-top:10px; padding:10px 12px; border-radius:12px; background:#ff8a9b26; color:var(--danger); font-size:13px; }

  /* ---------- tabs */
  .tabs { display:flex; gap:4px; position:relative; border-bottom:1px solid var(--line); margin-bottom:12px; overflow-x:auto; scrollbar-width:none; }
  .tab { background:none; border:0; padding:11px 14px; font-weight:600; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:7px; border-bottom:3px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s; border-radius:10px 10px 0 0; }
  .tab:hover { color:var(--text); background:var(--card); }
  .tab.on { color:var(--accent); border-image:var(--grad) 1; border-bottom-width:3px; font-weight:800; }
  .badge { min-width:19px; height:19px; padding:0 5px; border-radius:99px; background:var(--pink); color:#fff; font-size:11px; font-weight:800; display:inline-grid; place-items:center; }
  kbd { font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; padding:1px 6px; border-radius:6px; border:1px solid var(--line); border-bottom-width:2px; background:var(--card2); color:var(--muted); white-space:nowrap; }
  .tab kbd { opacity:.7; } @media (hover:none), (max-width:899px) { .tab kbd, .kbdonly { display:none; } }
  #panel { min-height: 60vh; }
  .panel { animation:rise .25s ease both; }
  @keyframes rise { from { opacity:0; } to { opacity:1; } }

  /* ---------- lists */
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:16px; background:var(--card); border:1px solid var(--line); position:relative; transition:transform .15s, background .15s, border-color .15s, box-shadow .15s; }
  .item:hover { background:var(--card2); }
  .item.sel { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .item.next::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:4px; background:var(--grad); }
  .item.drag { opacity:.4; } .item.over { border-color:var(--pink); transform:translateY(2px); }
  .item img { width:84px; aspect-ratio:16/9; object-fit:cover; border-radius:10px; background:var(--line); flex:none; }
  .meta { flex:1; min-width:0; }
  .t { font-weight:600; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .s { color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .acts { display:flex; gap:4px; align-items:center; flex:none; }
  .rowact { opacity:0; transition:opacity .15s; }
  .item:hover .rowact, .item.sel .rowact, .item:focus-within .rowact { opacity:1; }
  @media (hover:none) { .rowact { opacity:1; } }
  .ib { width:34px; height:34px; border-radius:10px; border:0; background:transparent; color:var(--muted); display:inline-grid; place-items:center; transition:background .12s, color .12s, transform .12s; }
  .ib:hover { background:var(--card); color:var(--text); } .ib:active { transform:scale(.9); }
  .ib.go:hover { background:#1fa85a; color:#fff; } .ib.bad:hover { background:#e5384f; color:#fff; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:99px; border:1px solid var(--line); background:var(--card); padding:9px 16px; font-weight:700; transition:transform .12s, box-shadow .12s, background .12s; }
  .btn:hover { background:var(--card2); } .btn:active { transform:scale(.97); }
  .btn.primary { border:0; color:#fff; background:var(--grad); box-shadow:0 4px 14px #7c3aed55; } .btn.primary:hover { box-shadow:0 6px 20px #7c3aed88; filter:brightness(1.07); }
  .btn.danger { color:var(--danger); } .btn.sm { padding:6px 12px; font-size:13px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .empty { text-align:center; padding:40px 16px; color:var(--muted); }
  .empty .logo2 { width:68px; height:68px; margin:0 auto 12px; border-radius:20px; background:var(--grad); display:grid; place-items:center; color:#fff; font-size:34px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }

  /* ---------- forms */
  input[type=text], input[type=search] { width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; font-size:16px; }
  input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  .search { display:flex; gap:8px; }
  label.sw { display:inline-flex; gap:8px; align-items:center; cursor:pointer; }
  .guest { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--line); flex:none; } .dot.on { background:var(--lime); box-shadow:0 0 8px var(--lime); }

  /* ---------- join + dialogs */
  .join { max-width:440px; margin:8vh auto 0; text-align:center; }
  .join .logo2 { width:84px; height:84px; margin:0 auto 12px; border-radius:26px; background:var(--grad); display:grid; place-items:center; color:#fff; box-shadow:0 10px 34px #7c3aed77; }
  .join h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.5px; }
  dialog { border:1px solid var(--line); border-radius:22px; background:var(--card); color:var(--text); padding:20px 22px; max-width:min(92vw,520px); box-shadow:var(--shadow); }
  dialog::backdrop { background:#0009; backdrop-filter:blur(3px); }
  dialog h3 { margin:0 0 10px; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:center; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translate(-50%,30px); opacity:0; background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px; z-index:60; transition:.25s; font-weight:600; max-width:90vw; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #offline { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:50; background:var(--danger); color:#1b0b0b; text-align:center; font-weight:700; padding:8px 16px; border-radius:99px; font-size:13px; box-shadow:var(--shadow); max-width:92vw; white-space:nowrap; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="offline" hidden>Brak połączenia z hostem – próbuję ponownie…</div>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px"><rect x="3" y="11" width="3.4" height="9" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="17.6" y="8" width="3.4" height="12" rx="1.7"/></svg></div>
    <div><div class="brand">Party Queue</div><div class="tag">kolejka na każdą imprezę</div></div>
    <div class="sp"></div>
    <span id="role" class="pill" hidden></span>
    <button class="iconbtn" id="helpBtn" title="Skróty klawiaturowe (?)" aria-label="Skróty klawiaturowe" hidden></button>
    <button class="iconbtn" id="themeBtn" title="Motyw: auto / jasny / ciemny (D)" aria-label="Zmień motyw"></button>
  </div>
</header>

<div id="join" hidden>
  <div class="join">
    <div class="logo2"><svg class="i" viewBox="0 0 24 24" style="width:46px;height:46px"><rect x="3" y="11" width="3.4" height="9" rx="1.7"/><rect x="10.3" y="4" width="3.4" height="16" rx="1.7"/><rect x="17.6" y="8" width="3.4" height="12" rx="1.7"/></svg></div>
    <h1>Dołącz do imprezy</h1>
    <p class="muted">Podaj imię, żeby inni wiedzieli, kto proponuje utwory.</p>
    <form id="joinForm" class="card" style="text-align:left">
      <input id="name" type="text" maxlength="24" placeholder="Twoje imię" autocomplete="nickname" aria-label="Twoje imię" autofocus>
      <p id="joinErr" style="color:var(--danger);min-height:1.4em;margin:8px 2px"></p>
      <button id="joinBtn" class="btn primary" style="width:100%" type="submit"></button>
    </form>
  </div>
</div>

<main id="app" hidden>
  <aside class="side">
    <section class="card np" id="np">
      <div class="np-top">
        <div class="np-art" id="npArt"></div>
        <div class="np-text" style="min-width:0">
          <div class="np-title" id="npTitle"></div>
          <div class="np-sub" id="npSub"></div>
        </div>
      </div>
      <div class="prog"><span id="npPos">0:00</span><div class="track" id="npTrack"><div id="npBar"></div></div><span id="npDur">0:00</span></div>
      <div class="ctl" id="hostCtl" hidden>
        <button class="iconbtn" id="bRepeat" title="Powtarzaj kolejkę (R)" aria-label="Powtarzaj"></button>
        <button class="iconbtn" id="bPrev" title="Poprzedni (P)" aria-label="Poprzedni"></button>
        <button class="iconbtn big" id="bToggle" title="Odtwarzaj / pauza (spacja)" aria-label="Odtwarzaj lub pauza"></button>
        <button class="iconbtn" id="bNext" title="Następny (N)" aria-label="Następny"></button>
      </div>
      <div class="vol" id="vol" hidden>
        <button class="iconbtn" id="bMute" title="Wycisz / przywróć dźwięk (M)" aria-label="Wycisz"></button>
        <input type="range" id="volRange" min="0" max="100" step="1" aria-label="Głośność" title="Głośność telefonu hosta (+ / −)">
        <output id="volOut">0%</output>
      </div>
      <div class="hint kbdonly" id="npHint" hidden>Spacja – pauza · N / P – następny / poprzedni · kliknij pasek, aby przewinąć</div>
    </section>
    <div id="notice" hidden></div>
  </aside>

  <section>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="panel" class="panel"></div>
  </section>
</main>

<dialog id="help">
  <h3>Skróty klawiaturowe</h3>
  <div class="keys" id="keys"></div>
  <form method="dialog" style="margin-top:16px;text-align:right"><button class="btn primary sm">Zamknij</button></form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>

  const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[name]}"/></svg>`;

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ------------------------------------------------------------------ theme
  const MODES = ['auto', 'light', 'dark'];
  let mode = MODES.includes(store.get('pq_theme')) ? store.get('pq_theme') : 'auto';
  const dark$ = matchMedia('(prefers-color-scheme: light)');
  function applyTheme() {
    const light = mode === 'light' || (mode === 'auto' && dark$.matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    $('themeBtn').innerHTML = icon(mode === 'auto' ? 'auto' : mode === 'light' ? 'sun' : 'moon');
    $('themeBtn').title = 'Motyw: ' + { auto: 'automatyczny', light: 'jasny', dark: 'ciemny' }[mode] + ' (D)';
  }
  function cycleTheme() { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; store.set('pq_theme', mode); applyTheme(); }
  dark$.addEventListener?.('change', applyTheme);
  $('themeBtn').onclick = cycleTheme;
  $('helpBtn').innerHTML = icon('keyboard');
  $('joinBtn').innerHTML = icon('check') + ' Dołącz';

  // ------------------------------------------------------------------ session
  let token = store.get('pq_token');
  let lastRole = '', state = null, ws = null, retry = 0, tab = 'queue', results = [], searching = false, selected = null, dragUid = null;

  async function api(path, body, method) {
    const r = await fetch(path, {
      method: method || (body === undefined ? 'GET' : 'POST'),
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),

    let data = {};
    try { data = await r.json(); } catch {}
    if (r.status === 401) { logout(); throw new Error('Sesja wygasła – dołącz ponownie'); }
    if (!r.ok) throw new Error(data.error || 'Błąd ' + r.status);
    return data;
  }
  const act = (path, body, ok) => api(path, body || {}).then((r) => { if (ok) toast(ok); return r; }).catch((e) => { toast(e.message); });

  function showJoin() {
    $('app').hidden = true; $('join').hidden = false; $('helpBtn').hidden = true; $('role').hidden = true;
    $('name').value = $('name').value || store.get('pq_name');
    setTimeout(() => $('name').focus(), 50);
  }
  function logout() {
    store.del('pq_token'); token = ''; state = null;
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    $('offline').hidden = true;
    showJoin();
  }

  $('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('joinErr').textContent = '';
    const name = $('name').value.trim();
    if (!name) { $('joinErr').textContent = 'Podaj imię'; return; }
    $('joinBtn').disabled = true;
    try {
      const r = await fetch('/api/join', { method: 'POST', body: JSON.stringify({ name }) });
      let data = {};
      try { data = await r.json(); } catch {}
      if (!r.ok) throw new Error(data.error || 'Nie udało się dołączyć');
      token = data.token; store.set('pq_token', token); store.set('pq_name', name);
      await start();
    } catch (err) { $('joinErr').textContent = err.message; }
    $('joinBtn').disabled = false;
  });

  function connect() {
    if (ws || !token) return;
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?token=' + encodeURIComponent(token));
    ws.onopen = () => { retry = 0; $('offline').hidden = true; };
    ws.onmessage = (e) => { try { state = JSON.parse(e.data); render(); } catch (err) { console.error(err); } };
    ws.onclose = () => {
      ws = null;
      if (!token) return;
      $('offline').hidden = false;
      setTimeout(connect, Math.min(1000 * 2 ** retry++, 8000));
    };
  }

  async function start() {
    try { state = await api('/api/state'); } catch { return; }
    $('join').hidden = true; $('app').hidden = false; $('helpBtn').hidden = false;

  }

  const isHost = () => !!state && state.me.role === 'HOST';

  // ------------------------------------------------------------------ rendering
  // Updates arrive every second (playback position). Sections are rebuilt only when their own data changed,
  // so hovering, focus, text being typed and scroll positions survive.
  const sigs = {};
  function section(key, data, build) {
    const sig = JSON.stringify(data);
    if (sigs[key] === sig) return false;
    sigs[key] = sig; build(); return true;
  }

  const tabsFor = () => {
    const t = [['queue', 'Kolejka', 'list', 0], ['search', 'Szukaj', 'search', 0]];
    if (isHost()) t.push(['proposals', 'Propozycje', 'inbox', state.proposals.length], ['guests', 'Goście', 'group', state.guests.filter((g) => g.hostRequested).length], ['playlist', 'Playlista', 'link', 0]);
    return t;
  };

  function render() {
    if (!state) return;
    // Promoted (or demoted) by a host: reload so the whole page is built for the new role.
    if (lastRole && lastRole !== state.me.role) {
      toast(state.me.role === 'HOST' ? 'Jesteś teraz hostem!' : 'Straciłeś(-aś) uprawnienia hosta');
      setTimeout(() => location.reload(), 900);
    }
    lastRole = state.me.role;
    const host = isHost();
    const role = $('role'); role.hidden = false; role.replaceChildren(el('span', { class: 'nm' }, (state.me.name || '') + ' · '), host ? 'host' : 'gość'); role.classList.toggle('host', host);

    // now playing
    const now = state.now, tr = now.track;
    section('np', [tr, now.status, state.playlist], () => {
      $('npTitle').textContent = tr ? tr.title : 'Nic nie gra';
      $('npArt').style.backgroundImage = tr ? `url("${tr.thumb}")` : '';
      $('npArt').innerHTML = tr ? '' : icon('bars').replace('class="i"', 'class="i" style="width:40px;height:40px;position:absolute;inset:0;margin:auto;opacity:.8"');
    });
    $('np').classList.toggle('playing', now.status === 'playing');
    $('npSub').innerHTML = '';
    $('npSub').append(el('span', { class: 'eq', html: '<i></i><i></i><i></i>' }),
      !tr ? (state.playlist ? 'Playlista: ' + state.playlist : 'Poproś hosta o playlistę') :
      now.status === 'loading' ? 'Ładowanie…' : now.status === 'ad' ? 'Reklama' : [tr.channel, tr.by && tr.src !== 'PLAYLIST' ? 'od: ' + tr.by : ''].filter(Boolean).join(' · '));
    $('npPos').textContent = fmt(now.pos); $('npDur').textContent = fmt(now.dur);
    $('npBar').style.width = now.dur ? Math.min(100, now.pos / now.dur * 100) + '%' : '0';
    $('npTrack').classList.toggle('seek', host);
    $('npHint').hidden = !host;
    $('hostCtl').hidden = !host;
    $('vol').hidden = !host || state.volume < 0;
    if (!volDragging && state.volume >= 0) setVolumeUi(state.volume);
    $('bToggle').innerHTML = icon(now.status === 'playing' ? 'pause' : 'play');
    $('bRepeat').innerHTML = icon('repeat'); $('bRepeat').classList.toggle('on', !!state.repeat);
    $('bRepeat').setAttribute('aria-pressed', !!state.repeat);
    $('bPrev').innerHTML = icon('prev'); $('bNext').innerHTML = icon('next');

    // tabs
    const tabs = tabsFor();
    if (!tabs.some((t) => t[0] === tab)) tab = 'queue';
    section('tabs', [tabs, tab], () => {
      $('tabs').replaceChildren(...tabs.map(([id, label, ic, n], i) =>
        el('button', { class: 'tab' + (id === tab ? ' on' : ''), role: 'tab', 'aria-selected': id === tab, on: { click: () => setTab(id) } },

    });

  }

  function setTab(id) {
    if (tab === id) return;

    if (id === 'search') setTimeout(() => $('q') && $('q').focus(), 30);
  }

  function renderPanel() {

        panel.replaceChildren(queueView(host));
      });
    } else if (tab === 'search') {

  }

  // ---- queue
  function queueView(host) {
    const q = state.queue;
    if (!q.length) return empty('Kolejka jest pusta', host ? 'Wczytaj playlistę w zakładce „Playlista” albo wyszukaj utwór.' : 'Wyszukaj utwór i zaproponuj go hostowi.');

        item.addEventListener('dragover', (e) => { if (dragUid && dragUid !== t.uid) { e.preventDefault(); item.classList.add('over'); } });

  // ---- search
  async function propose(m, next) {

  }
  async function search() {

    searching = false; render();
  }
  function searchView(mine, host) {
    const w = el('div');
    w.append(el('form', { class: 'search', on: { submit: (e) => { e.preventDefault(); search(); } } },
      el('input', { id: 'q', type: 'search', placeholder: 'Szukaj utworu lub wklej link do filmu', enterkeyhint: 'search', autocomplete: 'off', 'aria-label': 'Szukaj utworu' }),
      el('button', { class: 'btn primary', type: 'submit', disabled: searching, html: icon('search') }, searching ? 'Szukam…' : 'Szukaj')));

        el('div', { class: 'acts' },
          host ? el('button', { class: 'btn sm', html: icon('qnext'), on: { click: () => propose(m, true) }, title: 'Dodaj jako następną (na początek kolejki)', 'aria-label': 'Dodaj jako następną' }, 'Następna') : null,
          el('button', { class: 'btn primary sm', html: icon(host ? 'qend' : 'send'), on: { click: () => propose(m, false) }, title: host ? 'Dodaj na koniec kolejki' : 'Zaproponuj hostowi', 'aria-label': host ? 'Dodaj na koniec kolejki' : 'Zaproponuj' }, host ? 'Na koniec' : 'Zaproponuj'))))));
    } else {
      w.append(el('p', { class: 'muted', style: 'margin:14px 4px' }, host ? 'Jako host dodajesz utwory od razu: strzałka w górę – jako następną, strzałka w dół – na koniec kolejki.' : 'Host zatwierdzi Twoją propozycję, zanim trafi do kolejki.'));

    }
    return w;
  }

    return el('div', { class: 'list' }, p.map((x) => trackItem(x, x.by + ' · ' + (x.channel || ''), el('div', { class: 'acts' },
      btn('close', 'Odrzuć', () => act('/api/proposals/' + x.id + '/reject'), 'sm'),

  function guestsView() {
    const g = state.guests;
    if (!g.length) return empty('Nikt jeszcze nie dołączył', 'Pokaż gościom kod QR z aplikacji.');
    return el('div', { class: 'list' }, g.map((x) => el('div', { class: 'item guest' },
      el('span', { class: 'dot' + (x.online ? ' on' : '') }),
      el('div', { class: 'meta' }, el('div', { class: 't' }, x.name), el('div', { class: 's' }, x.role === 'HOST' ? 'Współhost' : x.hostRequested ? 'Prosi o uprawnienia hosta' : 'Gość')),
      el('div', { class: 'acts' },
        x.hostRequested ? [btn('close', 'Odrzuć', () => act('/api/guests/' + x.id + '/reject'), 'sm'), btn('check', 'Zatwierdź', () => act('/api/guests/' + x.id + '/approve'), 'primary sm')] : null,
        x.role === 'GUEST' && !x.hostRequested ? btn('star', 'Mianuj hostem', () => act('/api/guests/' + x.id + '/approve', {}, x.name + ' jest teraz hostem'), 'sm') : null,
        x.role === 'HOST' && x.id !== state.me.id ? btn('', 'Odbierz host', () => act('/api/guests/' + x.id + '/demote'), 'sm') : null,
        x.id !== state.me.id ? btn('trash', 'Usuń', () => confirm('Usunąć ' + x.name + '?') && act('/api/guests/' + x.id + '/kick'), 'danger sm') : null))));
  }

  function playlistView() {
    const w = el('div', { class: 'card' });
    w.append(el('p', { class: 'muted', style: 'margin-top:0' }, 'Wczytanie playlisty zastępuje utwory z poprzedniej playlisty. Zatwierdzone propozycje zostają. Utwory trafiają do kolejki w kolejności z YouTube.'));
    const url = el('input', { id: 'plUrl', type: 'text', placeholder: 'Link do publicznej playlisty YouTube', autocomplete: 'off', 'aria-label': 'Link do playlisty' });
    const shuffle = el('input', { id: 'plShuffle', type: 'checkbox' });
    const go = btn('link', 'Wczytaj playlistę', async () => {
      go.disabled = true;
      try { await api('/api/playlist', { url: url.value, shuffle: shuffle.checked }); toast('Playlista wczytana'); } catch (e) { toast(e.message); }
      go.disabled = false;
    }, 'primary');
    url.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
    w.append(url, el('div', { class: 'head', style: 'margin:12px 0 0' }, el('label', { class: 'sw' }, shuffle, 'Losowa kolejność'), el('span', { style: 'flex:1' }), go));
    return w;
  }

  // ------------------------------------------------------------------ volume (the host phone's media volume)
  let volDragging = false, volSent = 0, volBefore = 40, volTimer = 0;
  function setVolumeUi(v) {
    $('volRange').value = v; $('volOut').textContent = v + '%';
    $('bMute').innerHTML = icon(v === 0 ? 'mute' : 'volume');
  }
  function setVolume(v, now) {
    v = Math.min(100, Math.max(0, Math.round(v)));
    setVolumeUi(v);
    clearTimeout(volTimer);
    // While dragging, send at most ~10 updates a second; the last value always goes out.
    const wait = now ? 0 : Math.max(0, 100 - (Date.now() - volSent));
    volTimer = setTimeout(() => { volSent = Date.now(); act('/api/player/volume', { level: v }); }, wait);
  }
  const volNow = () => +$('volRange').value;
  $('volRange').addEventListener('input', () => { volDragging = true; setVolume(volNow()); });
  $('volRange').addEventListener('change', () => { $('volRange').blur(); setVolume(volNow(), true); setTimeout(() => { volDragging = false; }, 400); });
  $('bMute').onclick = () => { if (volNow() > 0) { volBefore = volNow(); setVolume(0, true); } else setVolume(volBefore || 40, true); };
  $('bMute').innerHTML = icon('volume');

  // ------------------------------------------------------------------ host controls
  $('bToggle').onclick = () => act('/api/player/toggle');
  $('bNext').onclick = () => act('/api/player/next');
  $('bPrev').onclick = () => act('/api/player/prev');
  $('bRepeat').onclick = () => act('/api/player/repeat', { on: !state.repeat });
  $('npTrack').addEventListener('click', (e) => {
    if (!isHost() || !state || !state.now.dur) return;
    const r = e.currentTarget.getBoundingClientRect();
    act('/api/player/seek', { ms: Math.round(state.now.dur * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))) });
  });

  // ------------------------------------------------------------------ keyboard
  const SHORTCUTS = [
    ['/', 'Szukaj utworu', false], ['1 – 5', 'Przełącz zakładki', false], ['D', 'Zmień motyw', false], ['?', 'Pokaż tę pomoc', false],
    ['Spacja', 'Odtwarzaj / pauza', true], ['N', 'Następny utwór', true], ['P', 'Poprzedni utwór', true], ['R', 'Powtarzanie kolejki', true], ['+  /  −', 'Głośniej / ciszej', true], ['M', 'Wycisz / przywróć dźwięk', true],
    ['↑ ↓  lub  J K', 'Zaznacz utwór w kolejce', true], ['Enter', 'Graj zaznaczony teraz', true], ['T', 'Zaznaczony na górę kolejki', true],
    ['Alt + ↑ / ↓', 'Przesuń zaznaczony wyżej / niżej', true], ['Delete', 'Usuń zaznaczony', true], ['Esc', 'Zamknij okno / odznacz', false],
  ];
  function openHelp() {
    const host = isHost();
    $('keys').replaceChildren(...SHORTCUTS.filter((s) => host || !s[2]).flatMap(([k, d]) =>
      [el('span', {}, ...k.split('  ').map((p, i) => i % 2 ? ' ' + p + ' ' : el('kbd', {}, p))), el('span', {}, d)]));
    $('help').showModal();
  }
  $('helpBtn').onclick = openHelp;

  function moveSel(delta) {
    const q = state.queue; if (!q.length) return;
    let i = q.findIndex((t) => t.uid === selected);
    i = i < 0 ? (delta > 0 ? 0 : q.length - 1) : Math.min(q.length - 1, Math.max(0, i + delta));
    selected = q[i].uid; sigs.panel = null; render();
    const n = document.querySelector('#qlist .item.sel'); if (n) n.scrollIntoView({ block: 'nearest' });
  }

  document.addEventListener('keydown', (e) => {
    if (!state || e.ctrlKey && e.key !== 'k' || e.metaKey && e.key !== 'k') return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
    const key = e.key;
    if (key === 'Escape') { if (typing) e.target.blur(); else if (selected) { selected = null; sigs.panel = null; render(); } return; }
    if (e.key === 'k' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setTab('search'); $('q') && $('q').focus(); return; }
    if (typing || $('help').open || e.target.tagName === 'BUTTON' && (key === ' ' || key === 'Enter')) return;
    const host = isHost();
    const tabs = tabsFor();
    if (/^[1-5]$/.test(key) && tabs[+key - 1]) { setTab(tabs[+key - 1][0]); return; }
    if (key === '/') { e.preventDefault(); setTab('search'); setTimeout(() => $('q') && $('q').focus(), 40); return; }
    if (key === '?') { openHelp(); return; }
    if (key === 'd' || key === 'D') { cycleTheme(); return; }
    if (!host) return;
    const sel = selected && state.queue.some((t) => t.uid === selected) ? selected : null;
    const arrow = key === 'ArrowDown' ? 1 : key === 'ArrowUp' ? -1 : key === 'j' ? 1 : key === 'k' ? -1 : 0;
    if (arrow && tab === 'queue') {
      e.preventDefault();
      if (e.altKey && sel) act('/api/queue/' + sel + '/move', { delta: arrow }); else moveSel(arrow);
      return;
    }
    switch (key) {
      case ' ': case 'MediaPlayPause': e.preventDefault(); act('/api/player/toggle'); break;
      case 'n': case 'N': case 'MediaTrackNext': act('/api/player/next'); break;
      case 'p': case 'P': case 'MediaTrackPrevious': act('/api/player/prev'); break;
      case 'r': case 'R': act('/api/player/repeat', { on: !state.repeat }); break;
      case '+': case '=': if (state.volume >= 0) setVolume(volNow() + 5, true); break;
      case '-': case '_': if (state.volume >= 0) setVolume(volNow() - 5, true); break;
      case 'm': case 'M': if (state.volume >= 0) $('bMute').click(); break;
      case 'Enter': if (sel && tab === 'queue') { e.preventDefault(); act('/api/queue/' + sel + '/playnow'); } break;
      case 't': case 'T': if (sel) act('/api/queue/' + sel + '/top'); break;
      case 'Delete': case 'Backspace': if (sel && tab === 'queue') { e.preventDefault(); act('/api/queue/' + sel + '/remove'); selected = null; } break;
    }
  });

  // ------------------------------------------------------------------ start
  applyTheme();
  if (token) start().then(() => { if (!state) showJoin(); }); else showJoin();
})();
</script>
</body>
</html>
